<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>Cercle Parfait</title>
<meta name="description" content="Trace un cercle au doigt ou à la souris autour du point central et mesure ta précision.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237c6cff'/%3E%3Cpath d='M27 30h20v20H27zM53 30h20v20H53zM27 56h20v20H27zM53 56h20v20H53z' fill='white'/%3E%3C/svg%3E">
<style>
/* Charte graphique alignée sur le portail outilotheque.fr :
   papier millimétré plein écran sur fond bleu nuit, centre fixe au milieu, score en haut, mesures en bas */
:root{
  color-scheme:dark;
  --bg:#0b1020; --grid:rgba(149,134,255,.07); --grid-strong:rgba(149,134,255,.16);
  --ink:#f4f5ff; --muted:#a1a9c4; --faint:#737e9f; --accent:#9586ff;
  --good:#69d9c3; --warn:#ffbd73; --bad:#ff777f;
  --panel-border:rgba(164,176,220,.13);
  --f-display:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{color:var(--ink);font-family:var(--f-display);letter-spacing:-.01em;overflow:hidden;
  background:radial-gradient(ellipse at 50% -20%,rgba(91,77,187,.2),transparent 55%),var(--bg);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ambient{position:fixed;pointer-events:none;filter:blur(90px);opacity:.12;border-radius:50%}
.ambient-one{width:340px;height:340px;background:#6f59ff;top:40%;left:-200px}
.ambient-two{width:300px;height:300px;background:#22c8b0;bottom:-120px;right:-170px;opacity:.08}
.app{position:relative;height:100%;display:flex;flex-direction:column}
.topbar{position:relative;z-index:2;height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid rgba(174,185,226,.1);background:rgba(9,14,29,.68);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.brand{display:flex;align-items:center;gap:11px;color:var(--ink);text-decoration:none;font-weight:850;font-size:14px;letter-spacing:.13em}
.brand-dot{color:var(--accent)}
.brand-mark{width:29px;height:29px;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;border-radius:9px;
  background:linear-gradient(140deg,#a89bff,#6957e8);box-shadow:0 4px 20px #7563ff33}
.brand-mark span{background:#fff;border-radius:2px;opacity:.95}
.brand-mark span:nth-child(2),.brand-mark span:nth-child(3){opacity:.62}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#dedaff;background:#7b6ae626;
  border:1px solid #9687ff30;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:800;transition:.18s ease}
.back:hover{background:#8c7aff3d;color:#fff}
.stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:absolute;left:0;right:0;top:0;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.label{display:inline-flex;align-items:center;gap:10px;font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#aaa0ff}
.hud .label::before,.hud .label::after{content:"";width:20px;height:1px;background:var(--accent);opacity:.8}
.score{font-size:clamp(52px,14vw,96px);font-weight:780;line-height:1;letter-spacing:-.06em;font-variant-numeric:tabular-nums;
  background:linear-gradient(100deg,#a99eff 5%,#7dcbdf 95%);color:transparent;-webkit-background-clip:text;background-clip:text}
.score small{font-size:.42em;font-weight:650;margin-left:2px}
.msg{font-size:14px;color:var(--muted);text-shadow:0 0 6px #0b1020,0 0 12px #0b1020;min-height:1.4em;text-wrap:balance;line-height:1.6}
.foot{position:absolute;left:0;right:0;bottom:0;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.panel{position:relative;overflow:hidden;border:1px solid var(--panel-border);border-radius:13px;padding:12px 14px;
  background:linear-gradient(145deg,rgba(25,33,57,.88),rgba(15,21,39,.88));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.panel::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:var(--accent);opacity:.8}
.stats{display:grid;grid-template-columns:auto auto;gap:3px 16px;margin:0;font-size:12px;font-variant-numeric:tabular-nums}
.stats dt{color:var(--faint);font-weight:650} .stats dd{margin:0;text-align:right;font-weight:700}
.best{text-align:right}
.best::before{background:var(--good)}
.best .label{color:var(--good);font-size:9px}
.best b{display:block;font-size:22px;font-weight:780;letter-spacing:-.04em;margin-top:2px;font-variant-numeric:tabular-nums}
@media (max-width:420px){.back span{display:none}}
</style>
</head>
<body>

<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
<div class="app">
  <header class="topbar">
    <a class="brand" href="https://outilotheque.fr/" aria-label="Retour au portail">
      <span class="brand-mark"><span></span><span></span><span></span><span></span></span>
      <span>LE HUB<span class="brand-dot">.</span></span>
    </a>
    <a class="back" href="https://outilotheque.fr/">← <span>Tous les outils</span></a>
  </header>
  <div class="stage">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="label" id="lab">Exemple</div>
    <div class="score" id="score">—</div>
    <div class="msg" id="msg">Posez le doigt et faites un tour complet autour du point central.</div>
  </div>
  <div class="foot">
    <dl class="stats panel">
      <dt>r min</dt><dd id="rmin">—</dd>
      <dt>r max</dt><dd id="rmax">—</dd>
      <dt>écart</dt><dd id="gap">—</dd>
    </dl>
    <div class="best panel"><span class="label">Record</span><b id="best">—</b></div>
  </div>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W,H,cx,cy,dpr;
let pts=[],drawing=false,result=null,isExample=true,turn=0,lastA=null;
let best=null;
try{const b=parseFloat(localStorage.getItem('cercle-best'));if(!isNaN(b))best=b}catch(e){}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* Règle de score : écart = (rmax - rmin) / rmax ; précision = 100 - écart% */
function score(list){
  let mn=Infinity,mx=0;
  for(const p of list){const r=Math.hypot(p.x-cx,p.y-cy);if(r<mn)mn=r;if(r>mx)mx=r}
  const gap=mx>0?(mx-mn)/mx*100:100;
  return{mn,mx,gap,pct:Math.max(0,100-gap)};
}

function resize(){
  dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const ncx=W/2,ncy=H/2;
  if(isExample||cx===undefined){cx=ncx;cy=ncy;makeExample()}
  cx=ncx;cy=ncy;draw();
}

function makeExample(){
  const R=Math.min(W,H)*0.3;pts=[];
  for(let i=0;i<=200;i++){const a=i/200*Math.PI*2-Math.PI/2;
    const r=R*(1+0.045*Math.sin(a*2+0.6)+0.02*Math.sin(a*5));
    pts.push({x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)})}
  result=score(pts);show(result);
}

function colorFor(dev){ // dev = écart relatif au rayon moyen, en %
  const d=Math.abs(dev);return d<2?css('--good'):d<6?css('--warn'):css('--bad');
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // papier millimétré
  const step=20;ctx.lineWidth=1;
  for(let x=(cx%step);x<W;x+=step){ctx.strokeStyle=Math.round((x-cx)/step)%5===0?css('--grid-strong'):css('--grid');
    ctx.beginPath();ctx.moveTo(Math.round(x)+.5,0);ctx.lineTo(Math.round(x)+.5,H);ctx.stroke()}
  for(let y=(cy%step);y<H;y+=step){ctx.strokeStyle=Math.round((y-cy)/step)%5===0?css('--grid-strong'):css('--grid');
    ctx.beginPath();ctx.moveTo(0,Math.round(y)+.5);ctx.lineTo(W,Math.round(y)+.5);ctx.stroke()}

  // cercles min / max après tracé
  if(result&&!drawing&&pts.length>2){
    ctx.setLineDash([5,6]);ctx.lineWidth=1.25;ctx.strokeStyle=css('--muted');
    for(const r of [result.mn,result.mx]){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke()}
    ctx.setLineDash([]);
  }

  // tracé
  if(pts.length>1){
    let sum=0;for(const p of pts)sum+=Math.hypot(p.x-cx,p.y-cy);const avg=sum/pts.length;
    ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=5;
    ctx.globalAlpha=isExample?0.45:1;
    for(let i=1;i<pts.length;i++){
      const r=Math.hypot(pts[i].x-cx,pts[i].y-cy);
      ctx.strokeStyle=colorFor((r-avg)/avg*100);
      ctx.beginPath();ctx.moveTo(pts[i-1].x,pts[i-1].y);ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  // centre
  ctx.strokeStyle=css('--accent');ctx.fillStyle=css('--accent');ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(cx-12,cy);ctx.lineTo(cx+12,cy);ctx.moveTo(cx,cy-12);ctx.lineTo(cx,cy+12);ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,3.5,0,Math.PI*2);ctx.fill();
}

function show(r){
  $('score').innerHTML=r?r.pct.toFixed(1)+'<small>%</small>':'—';
  $('rmin').textContent=r?Math.round(r.mn)+' px':'—';
  $('rmax').textContent=r?Math.round(r.mx)+' px':'—';
  $('gap').textContent=r?r.gap.toFixed(1)+' %':'—';
  $('best').textContent=best!=null?best.toFixed(1)+' %':'—';
}

function setMsg(t,color){$('msg').textContent=t;$('msg').style.color=color?css(color):''}

cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  drawing=true;isExample=false;result=null;turn=0;
  pts=[{x:e.offsetX,y:e.offsetY}];lastA=Math.atan2(e.offsetY-cy,e.offsetX-cx);
  $('lab').textContent='Précision';setMsg('Continuez jusqu’à boucler le tour…');show(null);draw();
});
cv.addEventListener('pointermove',e=>{
  if(!drawing)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of evs){
    const p={x:ev.offsetX,y:ev.offsetY};pts.push(p);
    const a=Math.atan2(p.y-cy,p.x-cx);let d=a-lastA;
    if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;turn+=d;lastA=a;
  }
  const r=score(pts);show(r);
  const deg=Math.min(360,Math.abs(turn)*180/Math.PI);
  setMsg(deg>=355?'Tour complet — vous pouvez lever le doigt':'Tour : '+Math.round(deg)+'°');
  draw();
});
function end(){
  if(!drawing)return;drawing=false;
  const r=score(pts);
  if(Math.abs(turn)<Math.PI*2*0.985){result=null;show(null);setMsg('Tour incomplet : faites le tour entier du centre.','--bad');draw();return}
  if(r.mn<25){result=null;show(null);setMsg('Trop près du centre : tracez un cercle plus grand.','--bad');draw();return}
  result=r;
  const isBest=best==null||r.pct>best;
  if(isBest){best=r.pct;try{localStorage.setItem('cercle-best',String(best))}catch(e){}}
  show(r);
  setMsg(isBest?'Nouveau record ! Touchez l’écran pour réessayer.':(r.pct>=95?'Excellent.':r.pct>=85?'Très bien.':r.pct>=70?'Pas mal.':'Encore un effort.')+' Touchez pour réessayer.',isBest?'--good':null);
  draw();
}
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);

const mq=window.matchMedia('(prefers-color-scheme: dark)');
mq.addEventListener&&mq.addEventListener('change',draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
window.addEventListener('resize',resize);
document.fonts&&document.fonts.ready.then(draw);
resize();
})();
</script>
</body>
</html>
